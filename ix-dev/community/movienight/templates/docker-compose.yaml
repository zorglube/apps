{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.add_caps(["SETUID", "SETGID", "CHOWN", "FOWNER", "DAC_OVERRIDE"]) %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/"}) %}

{% do c1.environment.add_user_envs(values.movienight.additional_envs) %}

{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_http_port}) %}
  {% do c1.add_port(values.network.https_port, {"container_port": values.consts.internal_thhp_port}) %}
  {% do c1.add_port(values.network.rtmp_port, {"container_port": values.consts.internal_rtmp_port}) %}
{% endif %}

{% do c1.add_storage(values.consts.internal_data_path, values.storage.data) %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
